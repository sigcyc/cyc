data_dir: /Volumes/ssd

# file_layout: omit for data_root/YYYYMMDD.parquet, "hive_sym" for data_root/sym=AAPL/YYYYMMDD.parquet

default:
  cols:
    core: [sym, time]
  calendar: nyse
futures_report:
  cols:
    core: [sym, time, Dealer_Positions_Long_All]
  sym: Market_and_Exchange_Names
  date: date
  data:
    path: ~/workspace/futures_report 

polygon_test:
  cols:
    core: [sym, time, price]
  sym: sym
  time: time
  data:
    path: /Users/yichenchen/workspace/cyc/data

instrument_id_test:
  cols:
    core: [sym, time]
  instrument_id: instrument_id
  time: time

# dividend is on ex_dividend_date
# split 4 means yesterday price is 4x today's price
stock_data_day:
  cols:
    core: [sym, close]
  time: window_start
  sym: ticker

stock_data_min1:
  cols:
    core: [sym, close]
  data:
  time: window_start
  sym: ticker
  script: data_script/massive_stock_data


crypto:
  cols:
    core: [sym, time, trade_side, trade_price, trade_amt]
  time: exchange_timestamp
  calendar: all_days
  file_layout: hive_sym

a_futures:
  cols:
    core: [sym, date, close]
  sym: sym
  date: date
  file_layout: single

a_futures_all:
  cols:
    core: [sym, date, close]
  sym: sym
  date: date
  file_layout: single_hive_sym

a_futures_instrument:
  cols:
    core: [sym, date, close, open_interest]
  sym: sym
  date: date
  calendar: sse

a_futures_instrument__index:

a_futures_study:
  cols:
    core: [sym, date, close, spread]
  sym: sym
  date: date
  calendar: sse
  file_layout: single


form13f:
  cols:
    core: [sym, date, cusip, value, shares]
  sym: underlying_symbol
  date: period_of_report
  file_layout: single

pdd_earnings:
  cols:
    core: [sym, date, canonical_line_item, rmb_thousands, usd_thousands]
  sym: sym
  date: date
  file_layout: single

# scheduled market-moving events (CPI, FOMC, index rebalances, ...); all_days
# calendar so events on non-NYSE days (e.g. NFP on Good Friday) are not skipped.
# script: data_scripts/market_moving_events
market_moving_events:
  cols:
    core: [sym, time]
  sym: sym
  time: time
  calendar: all_days

# A-share LJApi Level-2 dumps, parsed by the Rust a_stock_parser binary
# (~/workspace/a_stock_market_data_parser/docs/agent_skill_spec.md). One lossless
# parquet per trading date: a_stock_<ds>/YYYYMMDD.parquet under /Users/yichenchen/data.
# sym = lj_code (encoded u64 security id, decode at query time, see spec §5);
# time = localtime (epoch nanoseconds). file_layout 'date' is the default (omitted).
a_stock_order:
  cols:
    core: [sym, time, price, qty, side]
  sym: lj_code
  time: localtime
  calendar: sse
  data:
    path: /Users/yichenchen/data

a_stock_trade:
  cols:
    core: [sym, time, price, qty, side]
  sym: lj_code
  time: localtime
  calendar: sse
  data:
    path: /Users/yichenchen/data

a_stock_book:
  cols:
    core: [sym, time, lastprice]
  sym: lj_code
  time: localtime
  calendar: sse
  data:
    path: /Users/yichenchen/data

a_stock_index:
  cols:
    core: [sym, time, last]
  sym: lj_code
  time: localtime
  calendar: sse
  data:
    path: /Users/yichenchen/data

MarketDataTrades:
  time: TimeRecv
  instrument_id: InstrumentId
  enum:
    Exchange: Exchange

MarketDataQuotes:
  time: TimeRecv
  instrument_id: InstrumentId

MarketDataBars:
  time: TimeRecv
  instrument_id: InstrumentId
