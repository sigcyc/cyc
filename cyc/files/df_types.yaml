data_dir: /Volumes/ssd

# file_layout: omit for data_root/YYYYMMDD.parquet, "hive_sym" for data_root/sym=AAPL/YYYYMMDD.parquet

default:
  cols:
    core: [sym, time]
  sym: sym
  time: time
  calendar: nyse
futures_report:
  cols:
    core: [sym, time, Dealer_Positions_Long_All]
  sym: Market_and_Exchange_Names
  date: date
  data:
    path: ~/workspace/futures_report 

polygon_test:
  cols:
    core: [sym, time, price]
  sym: sym
  time: time
  data:
    path: /Users/yichenchen/workspace/cyc/data

# dividend is on ex_dividend_date
# split 4 means yesterday price is 4x today's price
stock_data_day:
  cols:
    core: [sym, close]
  time: window_start
  sym: ticker

stock_data_min1:
  cols:
    core: [sym, close]
  data:
  time: window_start
  sym: ticker
  script: data_script/massive_stock_data


crypto:
  cols:
    core: [sym, time, trade_side, trade_price, trade_amt]
  time: exchange_timestamp
  calendar: crypto
  file_layout: hive_sym

a_futures:
  cols:
    core: [sym, date, close]
  sym: sym
  date: date
  file_layout: single

a_futures_all:
  cols:
    core: [sym, date, close]
  sym: sym
  date: date
  file_layout: single_hive_sym

a_futures_instrument:
  cols:
    core: [sym, date, close, open_interest]
  sym: sym
  date: date
  calendar: sse

a_futures_instrument__index:

a_futures_study:
  cols:
    core: [sym, date, close, spread]
  sym: sym
  date: date
  calendar: sse
  file_layout: single


pdd_earnings:
  cols:
    core: [sym, date, canonical_line_item, rmb_thousands, usd_thousands]
  sym: sym
  date: date
  file_layout: single
